[build]
builder = "nixpacks"
buildCommand = "./mvnw clean package -DskipTests"

[deploy]
startCommand = "java -Dserver.port=$PORT -Dspring.profiles.active=prod -jar target/*.jar --server.port=$PORT"
healthcheckPath = "/actuator/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"

[deploy.lifecycle]
postDeploy = "echo 'Deployment complete!'"

[[ports]]
port = "$PORT"
internal = false 